[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memoryflow-agent-memory-auditor"
version = "0.1.0"
description = "Telemetry-only verifier for dynamic memory quality in LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "MemoryFlow contributors" }
]
keywords = [
  "llm",
  "agents",
  "memory",
  "telemetry",
  "audit",
  "observability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
]
dev = [
  "bandit>=1.7.10",
  "coverage[toml]>=7.6",
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6.9",
]

[project.scripts]
memoryflow = "memoryflow.cli:main"

[project.urls]
Homepage = "https://github.com/kadubon/memoryflow-agent-memory-auditor"
Issues = "https://github.com/kadubon/memoryflow-agent-memory-auditor/issues"
Source = "https://github.com/kadubon/memoryflow-agent-memory-auditor"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryflow"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.git",
  "/.github",
  "/.hypothesis",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/build",
  "/dist",
  "/htmlcov",
  "/memoryflow-examples",
  "/.coverage",
  "*.egg-info",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["memoryflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["memoryflow"]
